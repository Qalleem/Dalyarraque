<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="glow" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#ff6d00" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ff6d00" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="88" ry="88" fill="#111114"/>

  <!-- Glow layer -->
  <rect width="512" height="512" rx="88" ry="88" fill="url(#glow)"/>

  <!-- Orange halo behind Q -->
  <ellipse cx="256" cy="228" rx="130" ry="110" fill="#ff6d00" opacity="0.12" filter="url(#blur)"/>

  <!-- Big Q -->
  <text
    x="256" y="295"
    font-family="'Arial Black', 'Helvetica Neue', Impact, sans-serif"
    font-size="296"
    font-weight="900"
    fill="#ff6d00"
    text-anchor="middle"
    dominant-baseline="middle"
    letter-spacing="-8">Q</text>

  <!-- Separator line -->
  <rect x="178" y="362" width="156" height="3" rx="1.5" fill="#ff6d00" opacity="0.35"/>

  <!-- BOOTH label -->
  <text
    x="256" y="400"
    font-family="'Courier New', 'IBM Plex Mono', monospace"
    font-size="42"
    font-weight="600"
    letter-spacing="11"
    fill="#ff6d00"
    fill-opacity="0.58"
    text-anchor="middle">BOOTH</text>

  <!-- Top accent dots -->
  <circle cx="212" cy="108" r="5" fill="#ff6d00" opacity="0.5"/>
  <circle cx="256" cy="100" r="7" fill="#ff6d00" opacity="0.7"/>
  <circle cx="300" cy="108" r="5" fill="#ff6d00" opacity="0.5"/>
</svg>
